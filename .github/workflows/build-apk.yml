name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync web assets with Capacitor Android
        run: npx cap sync android
        working-directory: apps/app

      - name: Set up Gradle execute permissions
        run: chmod +x gradlew
        working-directory: apps/app/android

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/app/android

      - name: Prepare APK artifact
        run: |
          cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk munshi-app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munshi-app-debug
          path: munshi-app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest munshi-app-debug.apk \
            --title "Munshi Android App (Latest Build)" \
            --notes "Automated build of Munshi Android App from main branch (${{ github.sha }})." \
            --clobber || \
          gh release upload latest munshi-app-debug.apk --clobber
