name: Build Android APK & Deploy Promo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync web assets with Capacitor Android
        run: npx cap sync android
        working-directory: apps/app

      - name: Set up Gradle execute permissions
        run: chmod +x gradlew
        working-directory: apps/app/android

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/app/android

      - name: Prepare APK artifact
        run: |
          cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk munshi-app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munshi-app-debug
          path: munshi-app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 munshi-app-debug.apk --clobber || \
          gh release create v1.0.0 munshi-app-debug.apk \
            --title "Munshi Android App v1.0.0" \
            --notes "Automated build of Munshi Android App from main branch (${{ github.sha }})." \
            --latest

  deploy-site:
    name: Deploy Munshi Web App & Promo to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Prepare Pages directory
        run: |
          mkdir -p pages-site/promo
          cp -r apps/app/dist/* pages-site/
          cp promo/index.html pages-site/promo/index.html
          cp apps/app/dist/index.html pages-site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
