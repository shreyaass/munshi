name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync web assets with Capacitor Android
        run: npx cap sync android
        working-directory: apps/app

      - name: Set up Gradle execute permissions
        run: chmod +x gradlew
        working-directory: apps/app/android

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/app/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munshi-app-debug
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
